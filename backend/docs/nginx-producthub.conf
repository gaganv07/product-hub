# ===================================================================
# Nginx Reverse Proxy Configuration for ProductHub on AWS EC2
# Destination: /etc/nginx/sites-available/producthub
# ===================================================================

# Upstream Node.js Application Server
upstream producthub_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g. producthub.yourdomain.com) or leave as _

    # Client Request Limits
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Gzip Compression for Fast Frontend Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Cache (CSS, JS, Favicons)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://producthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main Application Proxy (API & Single-Page Frontend)
    location / {
        proxy_pass http://producthub_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for live responsiveness
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Dedicated Health Check Endpoint
    location /api/health {
        proxy_pass http://producthub_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off; # Keep access logs clean from periodic monitoring pings
    }
}

